apiVersion: apps/v1
kind: Deployment
metadata:
  name: pennypilot-backend
  namespace: pennypilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pennypilot-backend
  template:
    metadata:
      labels:
        app: pennypilot-backend
    spec:
      containers:
        - name: backend
          image: pennypilot-backend:cca2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pennypilot-secrets
                  key: DATABASE_URL
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pennypilot-secrets
                  key: DATABASE_USERNAME
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pennypilot-secrets
                  key: DATABASE_PASSWORD
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pennypilot-secrets
                  key: GEMINI_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: pennypilot-backend
  namespace: pennypilot
spec:
  selector:
    app: pennypilot-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
