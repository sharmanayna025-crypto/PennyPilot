apiVersion: apps/v1
kind: Deployment
metadata:
  name: pennypilot-frontend
  namespace: pennypilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pennypilot-frontend
  template:
    metadata:
      labels:
        app: pennypilot-frontend
    spec:
      containers:
        - name: frontend
          image: pennypilot-frontend:cca2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pennypilot-frontend
  namespace: pennypilot
spec:
  selector:
    app: pennypilot-frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
